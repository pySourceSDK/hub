name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  build-n-deploy:
    name: Build docs and deploy to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write   # peaceiris pushes the built docs to gh-pages
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install sphinx

    - name: Sphinx doc build
      run: python -m sphinx docs/source docs/build

    - name: Deploy
      # build on every push and PR, but only publish from master itself
      if: github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        publish_branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        force_orphan: true
